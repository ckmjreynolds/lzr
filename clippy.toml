# Lint *levels* live in [workspace.lints] (Cargo.toml); this file only tunes lint *behaviour*.

# Pre-1.0: let clippy suggest signature changes on public items (e.g. needless_pass_by_value).
# Revisit at 1.0, when public signatures become a stability promise.
avoid-breaking-exported-api = false

# `dbg_macro` is enabled workspace-wide; tolerate it while debugging tests.
allow-dbg-in-tests = true
