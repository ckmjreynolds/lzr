[package]
name            = "lzr"
version         = "0.2.0"
edition         = "2024"
rust-version    = "1.85"

authors         = ["Chris Reynolds <chris@reynolds.guru>"]
description     = "Context-mixing compression CLI (Hutter prize attempt, v7)."
license         = "MIT OR Apache-2.0"
readme          = "README.md"
repository      = "https://github.com/ckmjreynolds/lzr"
keywords        = ["compression", "compress"]
categories      = ["compression"]
documentation   = "https://docs.rs/lzr"

include         = ["src/**", "Cargo.toml", "README.md", "LICENSE*"]

[features]
default     = ["submission"]
# Submission build: zero threading deps, no training dependencies. This is
# what ships. The `build.sh` CI gate verifies no threading crate sneaks in.
submission  = []
# v8 neural codec: pulls in burn (heavy, threaded) — NOT in the submission set.
neural      = ["dep:burn"]

[dependencies]
anyhow      = "=1.0.102"
clap        = { version = "=4.6.1", features = ["derive"] }
burn        = { version = "0.21", optional = true, default-features = false, features = ["std", "wgpu", "ndarray", "autodiff"] }

[[example]]
name = "burnbench"
required-features = ["neural"]

[[example]]
name = "neural"
required-features = ["neural"]

# Optimize dependencies even in dev so neural iteration (CPU matmul etc.) is
# fair/fast; keep our own crate at dev opt for quick recompiles.
[profile.dev.package."*"]
opt-level = 3

[lints.rust]
keyword_idents = { level = "forbid", priority = -1 }
missing_copy_implementations = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
non_ascii_idents = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage_nightly)'] }
unreachable_pub = "deny"
# Crate-level default: deny unsafe. If any kernel needs unsafe later (NEON
# intrinsics etc.), it gets a localized `#[allow(unsafe_code)]` with
# documented justification — never a blanket allow at the crate root.
unsafe_code = "deny"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[lints.clippy]
all      = { level = "warn", priority = -1 }
cargo    = { level = "warn", priority = -1 }
nursery  = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Per-lint exceptions live as `#![allow(...)]` at the crate root in
# `src/main.rs` (and re-exports thereof). The Cargo.toml `[lints]` table
# has trouble overriding lint-group levels in this toolchain.

[profile.release]
strip = true
panic = "abort"
lto = "fat"
codegen-units = 1

# Final-submission build: optimize for *binary size* (counted 2× in Hutter's
# score), not throughput. UPX is applied on top at submission time. Build with
# `cargo build --profile submission`. Keeps the plain `release` profile fast for
# day-to-day v7/codec iteration.
[profile.submission]
inherits = "release"
opt-level = "z"
strip = "symbols"
lto = "fat"
panic = "abort"
codegen-units = 1

[profile.bench]
strip = true
panic = "abort"
lto = "fat"
codegen-units = 1
