[package]
name            = "lzr"
version         = "0.2.0"
edition         = "2024"
rust-version    = "1.85"

authors         = ["Chris Reynolds <chris@reynolds.guru>"]
description     = "Context-mixing compression CLI (Hutter prize attempt, v7)."
license         = "MIT OR Apache-2.0"
readme          = "README.md"
repository      = "https://github.com/ckmjreynolds/lzr"
keywords        = ["compression", "compress"]
categories      = ["compression"]
documentation   = "https://docs.rs/lzr"

include         = ["src/**", "Cargo.toml", "README.md", "LICENSE*"]

[dependencies]
lru         = "=0.18.0"
# Training-only, gated behind the `neural` feature (offline GPU pretraining of a
# small net via the `pretrain` example). NEVER in default/submission — trimmed to
# the wgpu+ndarray+autodiff backends (defaults pull 600+ media/web crates).
burn        = { version = "0.21", optional = true, default-features = false, features = ["std", "wgpu", "ndarray", "autodiff"] }

[dev-dependencies]
# Offline-only: suffix-array construction for the dictionary-candidate miner
# (the `dict_candidates_gen` #[ignore] test). Never in the submission binary —
# excluded from the `cargo tree -e=no-dev` threading gate and the release build.
cdivsufsort = "=2.0.0"

[features]
# `default == submission`: the shipped, single-threaded build — now includes the
# article-`reorder` preprocessor (enwik9 net 1.1440, free; full-enwik8 round-trip
# byte-exact). `build.sh` checks both this and `--no-default-features` (which builds
# WITHOUT reorder — the A/B baseline), and uses `--features submission` for the
# zero-threading-dependency `cargo tree` gate.
default     = ["submission"]
submission  = ["reorder"]
# `arm`: the online-neural LSTM arm, opt-in and NOT shipped — it is ~50x slower
# (enwik9 ~12 h) for a modest gain, so the default/submission build stays
# deterministic and fast. Enable for arm work: `cargo test --features arm`.
arm         = []
# `reorder`: article-reorder preprocessor (idea 3) as the FIRST pipeline stage —
# permutes <page> articles into a content-similarity order, restored on decode via
# each article's in-content page <id> (free, no shipped permutation). Now part of
# the shipped build (pulled by `submission`); `--no-default-features` builds without
# it for A/B. enwik9 gain ~-0.013; full-enwik8 round-trip byte-exact.
reorder     = []
# `neural`: offline GPU pretraining of a small byte-LM via burn (the `pretrain`
# example). Training-only — produces a weight blob the submission build embeds and
# runs on the CPU; burn is never in default/submission.
neural      = ["dep:burn"]

# Offline pretraining example (burn). Build/run with `--features neural`.
[[example]]
name              = "pretrain"
required-features = ["neural"]

# Stage-0 backbone bake-off (burn GPU). Build/run with `--features neural`.
[[example]]
name              = "bakeoff"
required-features = ["neural"]

# Optimize dependency crates even in dev so the burn `pretrain` example's CPU-side
# host code is fast to iterate without a full release/LTO build.
[profile.dev.package."*"]
opt-level = 3

# `release` is the iteration-speed default (CDR, 2026-06-24): `opt-level = 3` for
# the fastest encode/decode while we iterate — iteration speed currently outweighs
# the tiny L(D) cost of a slightly larger binary, and we switch to `ship` only when
# something is submission-worthy. It keeps fat LTO + a single codegen unit + symbol
# stripping, so the binary stays small (~419 KB) anyway. `panic="abort"` is
# intentionally NOT set — it breaks the libtest harness under `cargo test --release`
# (build.sh).
[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
strip         = true
panic         = "unwind"

# `ship`: the size-optimized SUBMISSION build — `opt-level = "s"` to minimize the
# binary, which counts 2x in the Hutter score (L(D) = 16 x bytes / 1e9). Versus
# `release` it is ~16 KB smaller (−0.00026 bpb L(D)) for 0 bpb of L(C): the output
# is byte-identical (Rust preserves IEEE FP across opt-levels — verified same
# archive SHA with the f32 neural mixer in the path). Build the actual submission
# with `cargo build --profile ship`; until then `release` (opt-3) is the default.
[profile.ship]
inherits      = "release"
opt-level     = "s"

[lints.rust]
keyword_idents = { level = "forbid", priority = -1 }
missing_copy_implementations = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
non_ascii_idents = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage_nightly)'] }
unreachable_pub = "deny"
# Crate-level default: deny unsafe. If any kernel needs unsafe later (NEON
# intrinsics etc.), it gets a localized `#[allow(unsafe_code)]` with
# documented justification — never a blanket allow at the crate root.
unsafe_code = "deny"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[lints.clippy]
all      = { level = "warn", priority = -1 }
cargo    = { level = "warn", priority = -1 }
nursery  = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Per-lint exceptions live as `#![allow(...)]` at the crate root in
# `src/main.rs` (and re-exports thereof). The Cargo.toml `[lints]` table
# has trouble overriding lint-group levels in this toolchain.
