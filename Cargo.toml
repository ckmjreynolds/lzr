[workspace]
members  = ["crates/*"]
# Virtual manifests have no `edition`, so the MSRV-aware resolver must be named explicitly.
resolver = "3"

[workspace.package]
version         = "0.1.0"
edition         = "2024"
rust-version    = "1.100"
authors         = ["Chris Reynolds <chris@reynolds.guru>"]
license         = "MIT OR Apache-2.0"
repository      = "https://github.com/ckmjreynolds/lzr"

# M-CARGO-WORKSPACE: every dependency is versioned here, members opt in with `foo.workspace = true`.
# Keep `default-features = false` here and enable features in the member that needs them.
[workspace.dependencies]
# Uncomment with the `lzr.workspace = true` line in crates/lzr-cli (cargo flags unused workspace deps).
# lzr = { path = "crates/lzr", version = "0.1.0" }

# anyhow = "1.0.104"
# arbitrary-int = "2.2.0"
# clap = "4.6.7"
# crc-fast = "1.10.0"
# rayon = "1.12.0"
# thiserror = "2.0.21"
# wabi_tree = "0.1.2"

# Dev-dependencies.
# assert_cmd = "2.2.2"
# pretty_assertions = "1.4.1"
# proptest = "1.11.0"

# https://microsoft.github.io/rust-guidelines/guidelines/universal/index.html
[workspace.lints.rust]
ambiguous_negative_literals = "warn"
missing_debug_implementations = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"
# Define custom opt-outs / opt-ins here:
# M-CANONICAL-DOCS / M-MODULE-DOCS: every public item is documented.
missing_docs = "warn"
# `pub` only for items that are actually exported, keeping the API surface deliberate (M-SINGLE-ITEM-PATH).
unreachable_pub = "warn"
# cargo-llvm-cov sets `coverage_nightly`; declare it so normal builds don't flag it.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage_nightly)'] }
unsafe_code = "forbid"

# https://microsoft.github.io/rust-guidelines/guidelines/universal/index.html
[workspace.lints.clippy]
cargo = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }

# Additional lints are from the `restriction` and `nursery` group that prevent specific constructs being used in source
# code in order to drive up consistency, quality, and brevity
allow_attributes_without_reason = "warn"
as_pointer_underscore = "warn"
assertions_on_result_states = "warn"
clone_on_ref_ptr = "warn"
deref_by_slicing = "warn"
disallowed_script_idents = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
fn_to_numeric_cast_any = "warn"
if_then_some_else_none = "warn"
map_err_ignore = "warn"
redundant_type_annotations = "warn"
renamed_function_params = "warn"
semicolon_outside_block = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unneeded_field_pattern = "warn"
unused_result_ok = "warn"
too_long_first_doc_paragraph = "warn"

# Define custom opt-outs / opt-ins here:
# M-LINT-OVERRIDE-EXPECT: overrides use `#[expect]`, which goes stale loudly; `#[allow]` does not.
allow_attributes = "warn"
# Leftovers that must not ship.
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
# Duplicate transitive versions are outside our control.
multiple_crate_versions = "allow"

# Custom: Cargo's own lints (not in the published guideline). Needs a cargo that understands
# `[lints.cargo]`; lowering the MSRV below that brings back "unused manifest key" warnings.
[workspace.lints.cargo]
# Replaces cargo-udeps: an unused dependency is a hard error.
unused_dependencies = "deny"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"

# Release codegen with symbols, for profilers (M-HOTPATH): `cargo build --profile profiling`.
[profile.profiling]
inherits = "release"
debug = true
strip = "none"
