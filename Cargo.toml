[package]
name            = "lzr"
version         = "0.2.0"
edition         = "2024"
rust-version    = "1.85"

authors         = ["Chris Reynolds <chris@reynolds.guru>"]
description     = "Context-mixing compression CLI (Hutter prize attempt, v7)."
license         = "MIT OR Apache-2.0"
readme          = "README.md"
repository      = "https://github.com/ckmjreynolds/lzr"
keywords        = ["compression", "compress"]
categories      = ["compression"]
documentation   = "https://docs.rs/lzr"

include         = ["src/**", "Cargo.toml", "README.md", "LICENSE*"]

[dependencies]
clap        = { version = "=4.6.1", features = ["derive"] }
lru         = "=0.18.0"

[dev-dependencies]
# Offline-only: suffix-array construction for the dictionary-candidate miner
# (the `dict_candidates_gen` #[ignore] test). Never in the submission binary —
# excluded from the `cargo tree -e=no-dev` threading gate and the release build.
cdivsufsort = "=2.0.0"

[features]
# `default == submission`: the shipped, single-threaded build. `build.sh` checks
# both this and `--no-default-features`, and uses `--features submission` for the
# zero-threading-dependency `cargo tree` gate.
default     = ["submission"]
submission  = []
# `arm`: the online-neural LSTM arm, opt-in and NOT shipped — it is ~50x slower
# (enwik9 ~12 h) for a modest gain, so the default/submission build stays
# deterministic and fast. Enable for arm work: `cargo test --features arm`.
arm         = []

[lints.rust]
keyword_idents = { level = "forbid", priority = -1 }
missing_copy_implementations = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
non_ascii_idents = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage_nightly)'] }
unreachable_pub = "deny"
# Crate-level default: deny unsafe. If any kernel needs unsafe later (NEON
# intrinsics etc.), it gets a localized `#[allow(unsafe_code)]` with
# documented justification — never a blanket allow at the crate root.
unsafe_code = "deny"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[lints.clippy]
all      = { level = "warn", priority = -1 }
cargo    = { level = "warn", priority = -1 }
nursery  = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Per-lint exceptions live as `#![allow(...)]` at the crate root in
# `src/main.rs` (and re-exports thereof). The Cargo.toml `[lints]` table
# has trouble overriding lint-group levels in this toolchain.
