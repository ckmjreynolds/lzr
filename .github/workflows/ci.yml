name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  # Weekly run catches new RustSec advisories and beta regressions even when the code is idle.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

# Supersede stale PR runs; never cancel runs on main or tags (a tag run may be publishing).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Selects [profile.ci] in .config/nextest.toml for every nextest invocation.
  NEXTEST_PROFILE: ci

# Every check job runs one step of build.sh, so `./build.sh` locally is a proxy for CI.
# Toolchain installation and caching stay here; the commands live in build.sh.
defaults:
  run:
    shell: bash

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: ./build.sh fmt

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: ./build.sh lint

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: ./build.sh doc

  # Test matrix across platforms and Rust versions
  test:
    name: Test (${{ matrix.os }}, ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    # Beta regressions are reported but do not block merges.
    continue-on-error: ${{ matrix.rust == 'beta' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, beta]
        include:
          # MSRV on Linux only. Keep in sync with `rust-version` in Cargo.toml.
          - os: ubuntu-latest
            rust: "1.100"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: ./build.sh test ${{ matrix.rust }}

  # Code coverage (Linux only, nightly for --doctests/--branch)
  coverage:
    name: Coverage
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: taiki-e/install-action@nextest
      - run: ./build.sh cov
      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: true

  # Advisories, licenses, bans and sources (deny.toml)
  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-deny
      - run: ./build.sh deny

  # Verify each crate packages and builds from its `include` list
  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: ./build.sh package

  # Publish to crates.io on version tags
  publish:
    name: Publish
    needs: [fmt, clippy, docs, test, coverage, deny, package]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Publish to crates.io
        run: cargo publish --locked --workspace --token ${{ secrets.CRATES_IO_TOKEN }}

  required:
    name: Required
    needs: [fmt, clippy, docs, test, coverage, deny, package]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job failed
        shell: bash
        run: |
          set -euo pipefail
          echo "fmt=${{ needs.fmt.result }}"
          echo "clippy=${{ needs.clippy.result }}"
          echo "docs=${{ needs.docs.result }}"
          echo "test=${{ needs.test.result }}"
          echo "coverage=${{ needs.coverage.result }}"
          echo "deny=${{ needs.deny.result }}"
          echo "package=${{ needs.package.result }}"

          test "${{ needs.fmt.result }}" = "success"
          test "${{ needs.clippy.result }}" = "success"
          test "${{ needs.docs.result }}" = "success"
          test "${{ needs.test.result }}" = "success"
          test "${{ needs.deny.result }}" = "success"
          test "${{ needs.package.result }}" = "success"

          # coverage can legitimately be "skipped" on fork PRs
          if [ "${{ needs.coverage.result }}" = "failure" ] || [ "${{ needs.coverage.result }}" = "cancelled" ]; then
            exit 1
          fi
