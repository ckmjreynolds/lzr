# https://nexte.st/docs/configuration/
#
# The default profile is used for local runs. CI selects the `ci` profile via
# NEXTEST_PROFILE=ci (works for both `cargo nextest` and `cargo llvm-cov nextest`,
# whose own `--profile` flag means the cargo build profile).

[profile.ci]
# Report every failure in one run instead of stopping at the first.
fail-fast = false
# Flag tests slower than 60s; kill one after 5 periods (5 min) so a hang fails
# the job instead of stalling it until the runner timeout.
slow-timeout = { period = "60s", terminate-after = 5 }
